# Keeps a PR red until its body has one valid `Changelog:` line.
#
# Source of truth is this file in turbot/shipyard (workflows/). It is published to
# .github/workflows/ in turbot/shipyard-workflows, and every repo calls that copy pinned by
# commit. See the README for the caller.
#
# Safe on `pull_request_target`: nothing here checks out or runs the PR's code. It reads
# the base branch's .github/release.json and runs shipyard at the commit this workflow
# itself was called at.

name: Changelog line

on:
  workflow_call:

permissions: {}

jobs:
  changelog-line:
    name: changelog-line
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # check out the base branch's .github/release.json
      pull-requests: write  # write the line on a Dependabot PR
      id-token: write       # learn which commit of this workflow is running (job_workflow_sha)
    steps:
      # The base branch, never the PR's head: a PR cannot edit the terms it is checked against.
      - name: Check out the repo's release config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: caller
          sparse-checkout: .github/release.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
      # workflow, which is the commit of shipyard to run.
      - name: Find this workflow's commit
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/changelog-line.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows changelog-line.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Changelog line::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      - name: Check the Changelog line
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node shipyard/bin/shipyard changelog-line --config caller/.github/release.json
