# Cuts a release: from the prep run's file to a `release/<version>` branch on the remote and the
# `release-pr` artifact the fleet's release-PR hook opens the PR from.
#
# Source of truth is this file in turbot/shipyard (workflows/). It is published to
# .github/workflows/ in turbot/shipyard-workflows, and every repo calls that copy at
# `v<major>` (`v0`), the tag each release moves to its own commit. See the README for the caller.
#
# It runs in the product repo, on its working branch, as the caller's own job: the hook takes
# only a run of the workflow the repo's declaration names, in that repo. The steps, in order, each
# stopping the job when it fails, so nothing is written to the remote after a refusal:
#   1. make the facts at the prep job's commit (`shipyard facts`);
#   2. check the prep file against those facts (`shipyard lint-prep`), so a prep file made for
#      another commit, or one that fails the lint, never gets further;
#   3. cut (`shipyard cut`): the commit with only the CHANGELOG section (the facts and notes ride in the PR body), made through GitHub's
#      API with the caller's token (so GitHub signs it: a repo that requires signed commits accepts it),
#      the branch on it, and the artifact. The commit the facts read must be in the history of the commit
#      the run started from; a re-ship's and a patch's is the tip of the base. The checkout is never committed to or pushed from;
#   4. upload the artifact: the files `branch`, `sha`, `title` and `body.md`.
# A light release (input `profile: light`) skips the prep file and its lint: the cut makes the version from the day and writes
# no CHANGELOG section or release notes (docs/how-we-release.md, "Light releases").
# A re-ship (input `reship`) skips the prep file and the facts: the cut reads the merged release PR's
# release data (its body), not the version's files, checks its release PR merged and its ship run failed, and makes the branch again. Its
# input `fixes` names commits of the working branch, which the cut cherry-picks onto the branch.
# It is started on the working branch like any cut (that is where the newest caller is, and where the
# fleet's hook opens the PR from); its commit is the tip of the base the version merged into.
# A patch (input `patch: true`, with `fixes`) ships fixes already merged into the working branch from the production
# tag: started by hand on the working branch, its commit is the tip of `base` (`main`, or `main-<x.y>`), the facts list
# the fix PRs (`shipyard facts --fixes`), the prep file is checked against them as any cut's, and the cut picks the fixes
# onto `release/<next patch>` after the cut commit, which records the working branch for the merge-back.
#
# Nothing from the caller's inputs goes into a shell line: each reaches a step as an environment
# variable and is checked there. The caller's code is never run with the token in its environment.

name: Cut a release

on:
  workflow_call:
    inputs:
      commit:
        description: The full 40-character commit the prep job read. The facts end here; the release is cut from it, and it must be in the history of the commit this run started from (a re-ship's and a patch's is the tip of its base, see reship and patch).
        type: string
        required: true
      prep-run:
        description: The id of the Actions run of this repo that made the prep file. Its artifact `prep` holds `prep.json`. Give this or `prep-file`.
        type: string
        required: false
        default: ''
      prep-file:
        description: A path in this repo, read at the commit this run started from, for a prep file made by hand (a person starting the cut). Give this or `prep-run`.
        type: string
        required: false
        default: ''
      tag-prefix:
        description: The prefix of the repo's release tags.
        type: string
        required: false
        default: v
      base:
        description: The branch the release PR goes into.
        type: string
        required: false
        default: main
      changelog:
        description: The product's changelog, relative to the repo.
        type: string
        required: false
        default: CHANGELOG.md
      profile:
        description: 'light: a light release (docs/how-we-release.md, "Light releases"), for a repo whose .github/release.json says "profile": "light". The cut reads no prep file and writes no CHANGELOG section or release notes; its version is the day''s. Leave out prep-run and prep-file. Empty: the full release.'
        type: string
        required: false
        default: ''
      reship:
        description: A re-ship (docs/release-cut.md) - the version whose release PR merged and whose ship run failed. Start the run on the working branch. The cut makes release/<version> again from the commit, which must be the tip of the branch the version merged into; no prep file is read. Leave out prep-run and prep-file.
        type: string
        required: false
        default: ''
      patch:
        description: 'A patch (docs/how-we-release.md, "Patches and patch lines") - true to ship the fixes already merged into the working branch from the tip of base (main, or main-<x.y>), the production tag''s branch, as release/<next patch>. Start the run on the working branch, with commit the tip of base and fixes the fixes'' merge commits. The prep file is made from facts with the fixes (shipyard facts --fixes), and its level is patch.'
        type: boolean
        required: false
        default: false
      fixes:
        description: With reship or patch. The fix commits of the working branch (the merge commits of PRs already merged and reviewed there), full 40-character commit ids separated by spaces. The cut cherry-picks them, in the order given, onto release/<version> after the re-ship commit (for a patch, after the cut commit), so the release PR holds the fix with no PR into the release branch. A patch takes at least one. A commit that changes a file under .github/workflows/ (the job's own token cannot write one, so a person cherry-picks it onto the release branch after the cut), is not on the working branch, did not come from a merged PR, or does not apply stops the cut before anything is written to the remote.
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  cut:
    name: cut
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two cuts at once would race for the same branch.
    concurrency:
      group: shipyard-cut-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write       # make the commit and release/<version> through the API (the caller's token)
      pull-requests: read   # the facts read each PR; the cut looks for candidates holding a number
      actions: read         # download the prep job's artifact
      id-token: write       # learn which commit of this workflow is running (job_workflow_sha)
    env:
      COMMIT: ${{ inputs.commit }}
      PREP_RUN: ${{ inputs.prep-run }}
      PREP_FILE: ${{ inputs.prep-file }}
      TAG_PREFIX: ${{ inputs.tag-prefix }}
      BASE: ${{ inputs.base }}
      CHANGELOG: ${{ inputs.changelog }}
      PROFILE: ${{ inputs.profile }}
      RESHIP: ${{ inputs.reship }}
      PATCH: ${{ inputs.patch }}
      FIXES: ${{ inputs.fixes }}
    steps:
      - name: Check the inputs
        shell: bash
        run: |
          fail() { echo "::error title=Cut::$1"; exit 2; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail 'commit must be a full 40-character commit id'
          [[ -z "$PROFILE" || "$PROFILE" = light ]] || fail 'profile is light, or empty for the full release'
          if [[ -n "$PROFILE" && -n "$RESHIP" ]]; then fail 'a re-ship is of a version that merged: leave out profile'; fi
          [[ -z "$PATCH" || "$PATCH" = true || "$PATCH" = false ]] || fail 'patch is true or false'
          if [[ "$PATCH" = true ]]; then
            [[ -z "$RESHIP" ]] || fail 'a patch ships new fixes as the next version, a re-ship finishes a version that merged: give one'
            [[ -z "$PROFILE" ]] || fail 'a light release has no patch: leave out profile'
            [[ -n "$FIXES" ]] || fail 'a patch ships fixes already merged into the working branch: name them in fixes'
            [[ "$GITHUB_REF_TYPE" = "branch" ]] || fail 'a patch is started on the working branch its fixes merged into, not on a tag'
          fi
          if [[ -n "$PROFILE" && ( -n "$PREP_RUN" || -n "$PREP_FILE" ) ]]; then fail 'a light release reads no prep file: leave out prep-run and prep-file'; fi
          if [[ -n "$RESHIP" ]]; then
            [[ "$RESHIP" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail 'reship must be a version, X.Y.Z'
            if [[ -n "$PREP_RUN" || -n "$PREP_FILE" ]]; then fail 'a re-ship reads no prep file: leave out prep-run and prep-file'; fi
          elif [[ -z "$PROFILE" ]]; then
            if [[ -n "$PREP_RUN" && -n "$PREP_FILE" ]]; then fail 'name the prep file once: prep-run or prep-file, not both'; fi
            if [[ -z "$PREP_RUN" && -z "$PREP_FILE" ]]; then fail 'name the prep file: prep-run (the prep job'"'"'s run) or prep-file (a path in the repo)'; fi
          fi
          if [[ -n "$FIXES" ]]; then
            [[ -n "$RESHIP" || "$PATCH" = true ]] || fail 'fixes goes with reship or patch: a cut takes no cherry-picks'
            [[ "$GITHUB_REF_TYPE" = "branch" ]] || fail 'fixes are commits of the working branch: start the re-ship on it, not on a tag'
            [[ "$FIXES" =~ ^[0-9a-f]{40}([[:space:]]+[0-9a-f]{40})*[[:space:]]*$ ]] || fail 'fixes must be full 40-character commit ids separated by spaces'
          fi
          if [[ -n "$PREP_RUN" && ! "$PREP_RUN" =~ ^[0-9]+$ ]]; then fail 'prep-run must be a run id (digits)'; fi
          if [[ "$PREP_FILE" == -* || "$PREP_FILE" == *..* ]]; then fail 'prep-file must be a path inside the repo'; fi
          [[ "$TAG_PREFIX" =~ ^[A-Za-z0-9._-]*$ ]] || fail 'tag-prefix may hold only letters, digits, dot, underscore and hyphen'
          [[ "$BASE" =~ ^[A-Za-z0-9._/-]+$ && "$BASE" != -* ]] || fail 'base must be a branch name'
          [[ "$CHANGELOG" =~ ^[A-Za-z0-9._/-]+$ && "$CHANGELOG" != -* && "$CHANGELOG" != *..* && "$CHANGELOG" != /* ]] || fail 'changelog must be a path inside the repo'

      # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
      # workflow, which is the commit of shipyard to run.
      - name: Find this workflow's commit
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/cut.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows cut.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Cut::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      # The prep job's commit, with every tag and branch: the facts read the tags, the cut looks at
      # the remote branches, and the cut checks the commit is in the history of this run's own
      # (a re-ship's or a patch's: it is the tip of the base's).
      # No credentials stay in the checkout: the facts' detector is the repo's own code.
      - name: Check out the repo at the prep job's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          path: caller
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The prep file comes from the prep job (its run's artifact) or, for a person starting the cut,
      # from a path in the repo at the commit this run started from. It is checked in the next steps.
      - name: Get the prep file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          if [[ -n "$RESHIP" ]]; then echo 'A re-ship reads no prep file.'; exit 0; fi
          if [[ -n "$PROFILE" ]]; then echo 'A light release reads no prep file.'; exit 0; fi
          if [[ -n "$PREP_RUN" ]]; then
            conclusion=$(gh run view "$PREP_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
            if [[ "$conclusion" != "success" ]]; then
              echo "::error title=Cut::run $PREP_RUN of this repo did not succeed (it is '$conclusion'), so its prep file is not used"
              exit 1
            fi
            gh run download "$PREP_RUN" --repo "$GITHUB_REPOSITORY" --name prep --dir "$RUNNER_TEMP/prep-download"
            [[ -f "$RUNNER_TEMP/prep-download/prep.json" ]] || { echo "::error title=Cut::the artifact 'prep' of run $PREP_RUN holds no prep.json"; exit 1; }
            mv "$RUNNER_TEMP/prep-download/prep.json" "$RUNNER_TEMP/release/prep.json"
          else
            git -C caller show "$GITHUB_SHA:$PREP_FILE" > "$RUNNER_TEMP/release/prep.json" \
              || { echo "::error title=Cut::cannot read $PREP_FILE at $GITHUB_SHA"; exit 2; }
          fi

      - name: Make the facts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$RESHIP" ]]; then echo 'A re-ship makes no facts: the cut reads the version'"'"'s own.'; exit 0; fi
          # A patch's facts list its fixes, the merge commits of the working branch this run started on.
          patch=()
          if [[ "$PATCH" = true ]]; then patch=(--fixes "$FIXES" --work-branch "$GITHUB_REF_NAME"); fi
          node shipyard/bin/shipyard facts --repo "$GITHUB_REPOSITORY" --to "$COMMIT" --tag-prefix "$TAG_PREFIX" --dir caller --out "$RUNNER_TEMP/release/facts.json" "${patch[@]}"

      # Refuses a prep file made for another range, and one that fails the lint: the job stops here.
      - name: Check the prep file against the facts
        shell: bash
        run: |
          if [[ -n "$RESHIP" ]]; then echo 'A re-ship has no prep file to check.'; exit 0; fi
          if [[ -n "$PROFILE" ]]; then echo 'A light release has no prep file to check.'; exit 0; fi
          node shipyard/bin/shipyard lint-prep "$RUNNER_TEMP/release/prep.json" --facts "$RUNNER_TEMP/release/facts.json"

      - name: Cut the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The branch this run started on is the work branch the candidate comes from: the cut commit
          # records it, and the merge-back after the tag reads it. A run on a tag records none.
          work=()
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then work=(--work-branch "$GITHUB_REF_NAME"); fi
          if [[ -n "$RESHIP" ]]; then
            # A re-ship: the version that merged, cut again from the commit with the files it left
            # there, and the work branch its first cut recorded.
            # `fixes` are commits of the working branch this run started on, cherry-picked after the re-ship
            # commit; the cut checks each and stops before anything is written when one fails. A re-ship is
            # cut from the tip of the base the version merged into, which is not in the working branch's
            # history (the failed ship made no tag, so nothing merged back): the cut checks it is that tip.
            fixes=()
            if [[ -n "$FIXES" ]]; then fixes=(--fixes "$FIXES"); fi
            node shipyard/bin/shipyard cut --reship "$RESHIP" --tag-prefix "$TAG_PREFIX" --repo "$GITHUB_REPOSITORY" \
              --dir caller --out "$RUNNER_TEMP/release/release-pr" --changelog "$CHANGELOG" "${work[@]}" "${fixes[@]}"
            exit 0
          fi
          if [[ -n "$PROFILE" ]]; then
            # A light release: no prep file, no CHANGELOG section. The cut refuses facts that do not say the repo is light.
            # The start names the working branch's tip as it is when the start runs, which can be newer than the commit this run was
            # queued at (a PR merged in between), so the commit must be in the history of the branch's tip the checkout fetched.
            within="$GITHUB_SHA"
            if [ "$GITHUB_REF_TYPE" = "branch" ]; then within="origin/$GITHUB_REF_NAME"; fi
            node shipyard/bin/shipyard cut \
              --facts "$RUNNER_TEMP/release/facts.json" \
              --dir caller --out "$RUNNER_TEMP/release/release-pr" --base "$BASE" --within "$within" "${work[@]}"
            exit 0
          fi
          if [[ "$PATCH" = true ]]; then
            # A patch is cut from the tip of the base, which is not in the working branch's history: the cut checks it is
            # that tip, in place of --within, and picks the fixes the facts name after the cut commit.
            node shipyard/bin/shipyard cut \
              --facts "$RUNNER_TEMP/release/facts.json" --prep "$RUNNER_TEMP/release/prep.json" \
              --dir caller --out "$RUNNER_TEMP/release/release-pr" --base "$BASE" --changelog "$CHANGELOG" "${work[@]}"
            exit 0
          fi
          node shipyard/bin/shipyard cut \
            --facts "$RUNNER_TEMP/release/facts.json" --prep "$RUNNER_TEMP/release/prep.json" \
            --dir caller --out "$RUNNER_TEMP/release/release-pr" --base "$BASE" --changelog "$CHANGELOG" --within "$GITHUB_SHA" "${work[@]}"

      # The four files the hook reads, and no others.
      - name: Upload the release-pr artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pr
          path: |
            ${{ runner.temp }}/release/release-pr/branch
            ${{ runner.temp }}/release/release-pr/sha
            ${{ runner.temp }}/release/release-pr/title
            ${{ runner.temp }}/release/release-pr/body.md
          if-no-files-found: error
          retention-days: 14
