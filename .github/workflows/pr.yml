# The PR side of Shipyard, behind the one fixed file every repo runs.
# Called by `.github/workflows/shipyard-pr.yml`, and by no other caller.
#
# Source of truth is this file in turbot/shipyard (workflows/). It is published to
# .github/workflows/ in turbot/shipyard-workflows, and every repo calls that copy at
# `v<major>` (`v0`), the tag each release moves to its own commit. The caller's triggers, its one
# job and its permission list are frozen: this file runs inside that list,
# and a test holds every job here to it.
#
# What it does, by the caller's event:
#   pull_request_target  a PR into `develop`: run `shipyard changelog-line --status`, which checks the
#                        PR body and posts the commit status `shipyard/changelog-line` on the PR's
#                        head (github.event.pull_request.head.sha). A PR into any other branch: nothing.
#   workflow_dispatch    the sweep: check every open PR into `develop` and post each one's status.
#   issue_comment        nothing yet. The comment commands move here with layer 2.
#
# Safe on `pull_request_target`: nothing here checks out or runs the PR's code, and no secret is
# used. It reads the base branch's .github/release.json (a sweep reads each PR's base branch's through
# the API), so a PR cannot edit the terms it is checked against, and runs shipyard at the commit this
# workflow itself was called at.

name: Shipyard PR

on:
  workflow_call:

permissions: {}

jobs:
  pr:
    name: pr
    # No runner for a comment or for a PR into another branch. `develop` is the work branch; the same
    # name is in the sweep step below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only what the steps below use. The caller grants more (issues: write and actions: write, for layer 2's comment
    # commands); a called job may ask for less, so the token holds nothing a step here does not need. A test
    # (test/pr-permissions.test.js) fails when this list asks for a permission no step uses.
    permissions:
      contents: read        # "Check out the repo's release config", and the sweep's read of each base branch's release.json
      pull-requests: read   # both changelog-line steps read the PR and its files, and the sweep lists the open PRs; nothing is written to a PR
      statuses: write       # both changelog-line steps post the commit status shipyard/changelog-line
      id-token: write       # "Find this workflow's commit" asks for an OIDC token to learn job_workflow_sha
    steps:
      # The base branch, never the PR's head: a PR cannot edit the terms it is checked against.
      - name: Check out the repo's release config
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: caller
          sparse-checkout: .github/release.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
      # workflow, which is the commit of shipyard to run.
      - name: Find this workflow's commit
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/pr.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows pr.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Shipyard PR::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      # The status goes on the PR's head: the CLI reads it from the event's pull_request.head.sha, then
      # from the live PR, so a re-run of an old event posts on the head the PR has now.
      - name: Check the Changelog line and post its status
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node shipyard/bin/shipyard changelog-line --status --config caller/.github/release.json

      # Every open PR into `develop`, each against its own base branch's release.json read through the API.
      - name: Check every open PR into the work branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node shipyard/bin/shipyard changelog-line --sweep --work-branch develop
