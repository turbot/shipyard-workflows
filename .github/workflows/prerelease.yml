# A prerelease (`v1.5.0-rc.1`) of the next version, at a commit of a work branch: an annotated tag made
# as the area's release App and a GitHub Release marked as a prerelease, with the build's files. Only a
# person in the area's approver team starts one, by hand. It writes no commit, branch, CHANGELOG section,
# PR, comment or announcement. docs/release-prerelease.md has the caller.
#
# Source of truth is this file in turbot/shipyard (workflows/). It is published to
# .github/workflows/ in turbot/shipyard-workflows, and every repo calls that copy at
# `v<major>` (`v0`), the tag each release moves to its own commit.
#
# The caller is a workflow_dispatch on `main` (the release environment allows main only, so the key is
# never reachable from a work branch), with the commit, the work branch, the version and the kind as
# inputs. It calls this workflow twice, around its own build:
#
#   step: start     checks who started the run (and who ran it again), the branch, the commit and the
#                   version, and outputs the tag and the version for the build. No release key.
#   (the build)     the caller's own job builds the commit with that version and uploads its files.
#   step: publish   in the caller's `release` environment: checks all of it again, then makes the tag,
#                   the GitHub Release (marked as a prerelease, never "latest") and attaches the files.
#                   The Release's body is the `Changelog:` lines of the PRs since the newest release.
#
# Who may start one is read from the approver team with `org-token`: the job's own token cannot see a
# team. Nothing here checks out the caller's repo or runs its code: GitHub is asked for the commit, the
# branch, the tags and the PRs since the newest release. The release App's token is made in the publish job and is in the environment of
# its last step alone. The files are data: they are read, never run.

name: Prerelease

on:
  workflow_call:
    inputs:
      step:
        description: 'start: check the run and name the tag (before the build). publish: make the tag and the Release (after the build).'
        type: string
        required: true
      commit:
        description: The full 40-character commit to make the prerelease of. It must be in the history of branch.
        type: string
        required: true
      branch:
        description: The work branch the commit is on (develop, develop-<x.y>), or the candidate (release/X.Y.Z). Never a PR's branch.
        type: string
        default: develop
      version:
        description: The version still to come, X.Y.Z, newer than the newest release.
        type: string
        required: true
      pre:
        description: 'The kind: alpha, beta or rc. The number after it is the next free one.'
        type: string
        required: true
      approvers:
        description: The area's approver team, as <org>/<team-slug>. Only its members start a prerelease.
        type: string
        required: true
      tag-prefix:
        description: The prefix of the repo's release tags.
        type: string
        default: v
      tag:
        description: 'With step publish: the tag the start step named (needs.<start job>.outputs.tag), which the build was made for.'
        type: string
        default: ''
      product:
        description: 'The product''s name, for the Release''s title ("<product> <version>"). Default: the repo''s name.'
        type: string
        default: ''
      assets:
        description: 'With step publish: the name of an artifact the caller''s build uploaded in this same workflow run. Its files are attached to the Release, which is made as a draft and published once they are on it. With none named, the Release carries no files.'
        type: string
        default: ''
    secrets:
      org-token:
        description: A token that can read the approver team's members. Without it the run refuses, as nobody could be told apart.
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: With step publish, the release App's key, passed by name as the secret of the same name (docs/release-tag.md). Its value comes from the caller's release environment, and only the publish job reads it.
        required: false
    outputs:
      tag:
        description: From step start, the prerelease's tag (v1.5.0-rc.1).
        value: ${{ jobs.start.outputs.tag }}
      version:
        description: From step start, the version the build carries, without the prefix (1.5.0-rc.1).
        value: ${{ jobs.start.outputs.version }}

permissions: {}

jobs:
  start:
    name: start
    if: ${{ inputs.step == 'start' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # the commit, the branch and the tags
      id-token: write       # learn which commit of this workflow is running (job_workflow_sha)
    outputs:
      tag: ${{ steps.start.outputs.tag }}
      version: ${{ steps.start.outputs.version }}
    steps:
      - name: Find this workflow's commit
        # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
        # workflow, which is the commit of shipyard to run.
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/prerelease.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows prerelease.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Prerelease::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      # Inputs reach the command as environment, never as shell text. GITHUB_EVENT_NAME, GITHUB_ACTOR and
      # GITHUB_TRIGGERING_ACTOR are the runner's own: who started the run, and who ran it again.
      - name: Check the run and name the tag
        id: start
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHIPYARD_ORG_TOKEN: ${{ secrets.org-token }}
          COMMIT: ${{ inputs.commit }}
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
          PRE: ${{ inputs.pre }}
          APPROVERS: ${{ inputs.approvers }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          node shipyard/bin/shipyard prerelease --step start --commit "$COMMIT" --branch "$BRANCH" --version "$VERSION" \
            --pre "$PRE" --approvers "$APPROVERS" --tag-prefix "$TAG_PREFIX"

  publish:
    name: publish
    if: ${{ inputs.step == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release    # the caller's: RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY (docs/release-apps.md)
    permissions:
      contents: read        # the commit, the branch, the tags, the Release and .github/release.json
      pull-requests: read   # the Changelog lines of the PRs since the newest release, for the Release's body
      id-token: write       # learn which commit of this workflow is running (job_workflow_sha)
    steps:
      # Before anything is read: the release environment's names are there, and the run is on main or
      # main-<x.y>, the only branches the environment may let reach the key. Never the job's own token
      # in place of the App's. Only whether the key is set reaches this step, never the key.
      - name: Check the release environment
        shell: bash
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [ -n "$CLIENT_ID" ] || missing+=("the variable RELEASE_APP_CLIENT_ID is not set in the release environment")
          [ "$HAS_KEY" = "true" ] || missing+=("the secret RELEASE_APP_PRIVATE_KEY is not set in the release environment, or the caller does not pass it by name")
          for m in "${missing[@]}"; do echo "::error title=Prerelease::${m}: set it up as docs/release-apps.md and docs/release-prerelease.md in turbot/shipyard say. Nothing was made"; done
          [ "${#missing[@]}" -eq 0 ] || exit 1
          if ! [[ "$GITHUB_REF" =~ ^refs/heads/main(-(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?)?$ ]]; then
            echo "::error title=Prerelease::the release key is read only on main or main-<x.y>: start the prerelease workflow on main, naming the work branch's commit. Nothing was made"
            exit 1
          fi

      - name: Find this workflow's commit
        # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
        # workflow, which is the commit of shipyard to run.
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/prerelease.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows prerelease.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Prerelease::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      # For this repo only, with contents write alone: the tag and the Release. The action revokes it when the job ends.
      - name: Make the release App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # The build's files, when the caller names an artifact. This step may fail and go on: the publish step
      # is told, and refuses before anything is tagged (a download that failed partway is refused the same
      # way), naming the artifact. It holds no token of the release App's.
      - name: Download the build's files
        id: download
        if: ${{ inputs.assets != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.assets }}
          path: ${{ runner.temp }}/prerelease-assets

      # Inputs reach the command as environment, never as shell text.
      - name: Make the tag and the Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHIPYARD_ORG_TOKEN: ${{ secrets.org-token }}
          RELEASE_TOKEN: ${{ steps.app.outputs.token }}
          COMMIT: ${{ inputs.commit }}
          BRANCH: ${{ inputs.branch }}
          VERSION: ${{ inputs.version }}
          PRE: ${{ inputs.pre }}
          APPROVERS: ${{ inputs.approvers }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          TAG: ${{ inputs.tag }}
          PRODUCT: ${{ inputs.product }}
          ASSETS: ${{ inputs.assets }}
          ASSETS_DIR: ${{ runner.temp }}/prerelease-assets
          DOWNLOAD: ${{ steps.download.outcome }}
        run: |
          args=(--step publish --commit "$COMMIT" --branch "$BRANCH" --version "$VERSION" --pre "$PRE" --approvers "$APPROVERS" --tag-prefix "$TAG_PREFIX" --tag "$TAG")
          [ -n "$PRODUCT" ] && args+=("--product=$PRODUCT")
          [ -n "$ASSETS" ] && args+=("--assets=$ASSETS" "--assets-dir=$ASSETS_DIR")
          [ -n "$ASSETS" ] && [ "$DOWNLOAD" != "success" ] && args+=(--assets-failed)
          node shipyard/bin/shipyard prerelease "${args[@]}"
