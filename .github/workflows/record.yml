# Writes the verdict and the audit record on a release PR, and "Do not approve" (a HOLD) when a test, a
# smoke step or a check did not pass. It commits nothing: the release PR's head stays the commit the cut
# made, and the results stay in the release run's `results` artifact, which the page links.
#
# Both jobs hold `contents: write` although nothing is committed: GitHub refuses
# `markPullRequestReadyForReview` (and `convertPullRequestToDraft`) to an Actions token without it, so
# a record that says SHIP could not take the release PR out of draft, and the ask refused the draft.
# A called job's own grant caps the token, so a caller cannot make up for it. `workflows/contract.json`
# and the tests keep it.
#
# Source of truth is this file in turbot/shipyard (workflows/). It is published to
# .github/workflows/ in turbot/shipyard-workflows, and every repo calls that copy at
# `v<major>` (`v0`), the tag each release moves to its own commit. See the README for the caller.
#
# The caller runs it when the release PR opens and each time the PR, a review or a check changes.
# A review must never move the PR's head: the repo's `main` ruleset dismisses an approval when a
# commit is pushed. With `review: true` the second job runs and the first does not. It has no
# results of its own: it reads the release run the record already on the page names, uses it only
# when that run is this release's (a run of this repo that completed with success, on the working
# branch the cut commit names at the commit the cut was made from, or on the release branch at a
# commit of the candidate; its `results` artifact not expired; its build the one that run made),
# downloads its `results` and writes the body from them (`shipyard record --from-candidate --review
# --update`), and writes HOLD naming what failed otherwise. A page that names no run (a release PR
# recorded before the record stopped committing) is read from the evidence its head holds
# (`shipyard record --from-evidence --update`), or HOLD with the reason. The review commits nothing,
# runs no check again, and its one other write is the `shipyard/release` status below.
# The release PR is a draft until the record has written a SHIP at its head, so an approval is not
# asked for before the checks have run. The first pass makes the PR a draft (`--draft-until-ship`),
# so a push to the candidate makes it one again; the pass that writes the body marks it ready on
# SHIP and leaves it a draft on HOLD. A review run leaves it as it is. A change of draft state that
# fails is a warning, never a failed record.
# Each run reads GitHub as it is now and replaces the record already in the PR body, so a run
# that comes late or twice leaves the same record. The facts and the prep file are the ones
# `shipyard cut` put in the release PR's body, pinned by the cut commit, so the job needs only the
# PR's number and the results of the build, the tests and staging.
#
# Steps: read the PR's branch; check it out; download the results; make the record and make the PR a
# draft (`shipyard record`, which writes no body yet); run the caller's required-check workflows on the
# PR's head; wait for the other checks; report each dispatched run's jobs as commit statuses on the
# head; delete the held runs that stand behind a finished run; write the body (`shipyard record --update`).
# GitHub holds the `pull_request` runs of a release branch the cut pushed with the job's own token for
# a person's approval, so the checks the base branch's rules require would never run on the PR's head
# by themselves. A `workflow_dispatch` made with that token does start a run, so the job starts each
# workflow the caller lists in `required-check-workflows` on the release branch, at the PR's head.
# GitHub does not count a `workflow_dispatch` run's checks for a required check of a ruleset, so
# the job also posts each finished dispatched run's jobs as commit statuses on the head,
# named as the checks are: a status reports a real run of the repo's tests on that exact commit,
# and nothing is approved by hand. The held `pull_request` runs are never approved: the job deletes the
# ones of the workflows it ran, and of any workflow that finished on the build's source commit (the
# approver sees no run awaiting approval), and leaves the rest.
#
# A CLI's release PR is opened with the job's own token, and GitHub creates no workflow run for an
# event that token causes, bar `workflow_dispatch` and `repository_dispatch`: so the caller's Slack ask,
# started by `workflow_run` of this record, never runs. With `ask-workflow` set, the record starts the
# ask itself once the body says SHIP (below), by `workflow_dispatch` on the default branch with the PR's number.
#
# The same step that writes the body sets one commit status, `shipyard/release`, on the PR's head,
# from the verdict the body shows: success for SHIP
# approved at that head with nothing else open, pending for SHIP with a step still open (a check still
# running, a second approver) or with no approval of this head yet, failure for HOLD with the first reason
# as its description. A review sets it again on the same head, so an approval turns it green with no push;
# `main` can require it, and GitHub's auto-merge then waits for the approval to be recorded. Both jobs hold `statuses: write` for it, so a caller grants it
# on the job that calls this workflow (docs/release-record.md).

name: Record a release

on:
  workflow_call:
    inputs:
      pr:
        description: The release PR's number.
        type: string
        required: true
      results-run:
        description: The id of the Actions run of this repo that built, tested and staged the candidate. Its artifact `results` holds `results.json`, and `template-diff.txt` and `prod-plan.txt` when the repo's `.github/release.json` switches them on (docs/release-record.md). Required unless `review` is true.
        type: string
        required: false
        default: ''
      review:
        description: True when a review was submitted or dismissed. The record is read again from the results of the release run the record on the page names (or, for a release PR recorded before the record stopped committing, from the evidence its head holds) and only the PR body and its status are written; nothing is committed, pushed or run again.
        type: boolean
        required: false
        default: false
      ignore-checks:
        description: Comma-separated names of checks the record does not judge (this workflow's own check, for one).
        type: string
        required: false
        default: ''
      fleet-logins:
        description: Comma-separated logins that are the fleet and never count as an independent approval, besides every bot account.
        type: string
        required: false
        default: ''
      armed-label:
        description: The label whose author counts as having driven a change.
        type: string
        required: false
        default: agent:ready
      changelog:
        description: The product's changelog, relative to the repo.
        type: string
        required: false
        default: CHANGELOG.md
      check-wait-minutes:
        description: How long to wait, at most (0 to 60), for the candidate's other checks to finish before the record is written, and again for each run of `required-check-workflows` to finish before its result is posted as a commit status. A check still running then is shown as waiting, and the record is written again when this is run again.
        type: string
        required: false
        default: '10'
      ask-workflow:
        description: The file name of this repo's ask workflow (in .github/workflows), such as `ask.yml`. It must accept `workflow_dispatch` with an input `pr`. When it is set and the record has just written SHIP at the PR's head, the record starts it on the default branch with the PR's number, once for each head, because a CLI's release PR is opened with the job's token and so starts no `workflow_run` of its own. A run of it is not judged by the record. Left empty, nothing is started (docs/release-ask.md).
        type: string
        required: false
        default: ''
      required-check-workflows:
        description: Comma-separated file names of this repo's workflows (in .github/workflows) that make the checks the base branch's rules require, such as `ci.yml`. Each must accept `workflow_dispatch`. Each is run on the release branch, so its checks land on the PR's head.
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  record:
    name: record
    if: ${{ !inputs.review }}
    runs-on: ubuntu-latest
    timeout-minutes: 150   # the two longest waits (60 minutes each: the other checks, then the dispatched runs) and the rest of the job
    # One record per PR at a time; a newer run waits for the one in flight.
    concurrency:
      group: shipyard-record-${{ github.repository }}-${{ inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: write        # for marking the release PR ready for review (and back to a draft), which GitHub refuses a token without it; the record commits nothing and moves no branch
      pull-requests: write   # write the record into the PR body
      issues: read           # who wrote and armed each change's issue
      checks: read           # the candidate's check runs
      statuses: write        # read its commit statuses, post the dispatched runs' results as statuses on the PR's head, and set `shipyard/release`
      actions: write         # download the results artifact; run the required-check workflows; read the event of each check run's workflow run
      id-token: write        # learn which commit of this workflow is running (job_workflow_sha)
    env:
      PR: ${{ inputs.pr }}
      RESULTS_RUN: ${{ inputs.results-run }}
      IGNORE_CHECKS: ${{ inputs.ignore-checks }}
      FLEET_LOGINS: ${{ inputs.fleet-logins }}
      ARMED_LABEL: ${{ inputs.armed-label }}
      CHANGELOG: ${{ inputs.changelog }}
      WAIT_MINUTES: ${{ inputs.check-wait-minutes }}
      CHECK_WORKFLOWS: ${{ inputs.required-check-workflows }}
      ASK_WORKFLOW: ${{ inputs.ask-workflow }}
    steps:
      - name: Check the inputs
        shell: bash
        run: |
          fail() { echo "::error title=Record::$1"; exit 2; }
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || fail 'pr must be the release PR'"'"'s number'
          [[ "$RESULTS_RUN" =~ ^[0-9]+$ ]] || fail 'results-run must be a run id (digits), unless review is true'
          [[ "$CHANGELOG" =~ ^[A-Za-z0-9._/-]+$ && "$CHANGELOG" != -* && "$CHANGELOG" != *..* && "$CHANGELOG" != /* ]] || fail 'changelog must be a path inside the repo'
          [[ "$WAIT_MINUTES" =~ ^[0-9]+$ ]] && (( WAIT_MINUTES <= 60 )) || fail 'check-wait-minutes must be a whole number from 0 to 60'
          [[ -z "$ASK_WORKFLOW" || "$ASK_WORKFLOW" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*\.ya?ml$ ]] || fail 'ask-workflow must be the file name of a workflow in .github/workflows (ask.yml)'
          IFS=$', \t' read -ra listed <<< "$(printf '%s' "$CHECK_WORKFLOWS" | tr '\n' ',')"
          for w in "${listed[@]}"; do
            if [[ -n "$w" && ! "$w" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*\.ya?ml$ ]]; then
              fail 'required-check-workflows must list file names of workflows in .github/workflows (ci.yml), comma-separated'
            fi
          done

      # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
      # workflow, which is the commit of shipyard to run.
      - name: Find this workflow's commit
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/record.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows record.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Record::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      # Only a candidate of this repo: `shipyard record` checks the PR again, but the branch is
      # named here, and an output is only used after it has matched the release branch pattern.
      - name: Find the release PR's branch
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.ref, .head.repo.full_name, .state] | @tsv')
          IFS=$'\t' read -r branch head_repo state <<< "$pull"
          if [[ ! "$branch" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Record::#$PR does not come from a release/X.Y.Z branch, so it is not a release PR"
            exit 1
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [[ "$(lower "$head_repo")" != "$(lower "$GITHUB_REPOSITORY")" ]]; then
            echo "::error title=Record::#$PR comes from another repo ($head_repo), not a candidate of this one"
            exit 1
          fi
          if [[ "$state" != "open" ]]; then
            echo "::error title=Record::#$PR is $state: a record is written for an open candidate"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The candidate's own branch, with its history and tags. No credentials stay in the checkout.
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          path: caller
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Get the results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RESULTS_RUN" --repo "$GITHUB_REPOSITORY" --name results --dir "$RUNNER_TEMP/results"
          [[ -f "$RUNNER_TEMP/results/results.json" ]] || { echo "::error title=Record::the artifact 'results' of run $RESULTS_RUN holds no results.json"; exit 1; }

      # The first pass reads the candidate and makes the PR a draft; the body is not written yet.
      - name: Make the record
        shell: bash
        env:
          SHIPYARD_SHA: ${{ steps.self.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          args=()
          if [[ -n "$SHIPYARD_SHA" ]]; then args+=(--shipyard-sha "$SHIPYARD_SHA"); fi
          if [[ -n "$IGNORE_CHECKS" ]]; then args+=(--ignore-checks "$IGNORE_CHECKS"); fi
          if [[ -n "$FLEET_LOGINS" ]]; then args+=(--fleet-logins "$FLEET_LOGINS"); fi
          if [[ -n "$ASK_WORKFLOW" ]]; then args+=(--ask-workflow "$ASK_WORKFLOW"); fi
          node shipyard/bin/shipyard record --from-candidate --draft-until-ship --release-run "$RESULTS_RUN" --results "$RUNNER_TEMP/results/results.json" --pr "$PR" \
            --dir caller --out "$RUNNER_TEMP/record.md" --changelog "$CHANGELOG" --armed-label "$ARMED_LABEL" "${args[@]}"

      # The PR's head may have no checks: a push made with a job's own token (the cut's) starts no
      # workflow that runs (its `pull_request` runs are held for approval and make no check).
      # A `workflow_dispatch` made with it does, so each listed workflow is run on the release
      # branch, which is at the PR's head, and the checks it makes land on that commit.
      # Every listed workflow must exist and be enabled before any is started, so a wrong name
      # starts none. One that already ran on this commit is not run again, so a run that comes
      # again starts nothing new; a run held for approval, cancelled or skipped did not run. Then wait, bounded (two minutes), for GitHub to show each run on
      # the commit, so the wait for the other checks below can see their checks.
      - name: Run the required checks on the PR's head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          fail() { echo "::error title=Record::$1"; exit 1; }
          IFS=$', \t' read -ra listed <<< "$(printf '%s' "$CHECK_WORKFLOWS" | tr '\n' ',')"
          workflows=()
          for w in "${listed[@]}"; do
            if [[ -n "$w" && " ${workflows[*]} " != *" $w "* ]]; then workflows+=("$w"); fi
          done
          if (( ${#workflows[@]} == 0 )); then
            echo 'No required-check-workflows listed: nothing to run.'
            exit 0
          fi
          head=$(git -C caller rev-parse HEAD)
          # Sets `runs` to the number of runs of workflow $1 on the head that ran, and `held` to
          # the number that did not; any doubt fails the job. A run held for approval
          # (`action_required`), cancelled or skipped made no check, so it is not a run: GitHub
          # holds the `pull_request` runs of a push made with the job's own token, and counting
          # one as "already run" would start nothing and leave the required check missing.
          count_runs() {
            local seen total
            seen=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?head_sha=$head&per_page=100" \
              --jq '[.total_count, ([.workflow_runs[] | select(.conclusion as $c | ["action_required", "cancelled", "skipped"] | index($c) | not)] | length)] | @tsv') \
              || fail "could not read the runs of the required-check workflow $1"
            IFS=$'\t' read -r total runs <<< "$seen"
            [[ "$total" =~ ^[0-9]+$ && "$runs" =~ ^[0-9]+$ ]] || fail "GitHub did not say how many runs the required-check workflow $1 has"
            (( total <= 100 )) || fail "the required-check workflow $1 has more than 100 runs on the head, too many to tell which ran"
            held=$((total - runs))
          }
          for w in "${workflows[@]}"; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w" --jq .state) \
              || fail "the required-check workflow $w could not be found in $GITHUB_REPOSITORY"
            [[ "$state" == active ]] || fail "the required-check workflow $w is $state, so it cannot be run"
          done
          started=()
          for w in "${workflows[@]}"; do
            count_runs "$w"
            if (( runs > 0 )); then
              echo "$w has already run on ${head:0:7}: not run again."
              continue
            fi
            if (( held > 0 )); then
              echo "$w has $held held, cancelled or skipped run(s) on ${head:0:7} and none that ran: running it."
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$w/dispatches" -f ref="$BRANCH" > /dev/null \
              || fail "the required-check workflow $w could not be run on $BRANCH: it must accept workflow_dispatch"
            echo "Started $w on $BRANCH (${head:0:7})."
            started+=("$w")
          done
          for _ in $(seq 1 24); do
            missing=()
            for w in "${started[@]}"; do
              count_runs "$w"
              if (( runs == 0 )); then missing+=("$w"); fi
            done
            if (( ${#missing[@]} == 0 )); then exit 0; fi
            sleep 5
          done
          echo "::warning title=Record::after two minutes GitHub shows no run on ${head:0:7} of: ${missing[*]} (started on $BRANCH, which may have moved). See the PR's checks"

      # A check from another workflow may still be running when the record is read, and a running
      # check never turns the recommendation. So wait, bounded, until the checks of the PR's head
      # and of the build's commit that are not this run's own, and not ignored, have finished.
      - name: Wait for the candidate's other checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git -C caller rev-parse HEAD)
          source=$(jq -r .build.source "$RUNNER_TEMP/results/results.json")
          unfinished() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$1/check-runs?per_page=100" \
              | jq -r --arg run "$GITHUB_RUN_ID" --arg ignore "$IGNORE_CHECKS" '
                  ($ignore | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $skip
                  | .check_runs[] | select(.status != "completed")
                  | select(((.details_url // "") | contains("/actions/runs/" + $run + "/")) | not)
                  | select(.name as $n | ($skip | index($n)) | not)
                  | .name'
          }
          deadline=$((SECONDS + 60 * WAIT_MINUTES))
          while :; do
            # Each read on its own: a GitHub error on either stops the job, never "nothing is running".
            on_head=$(unfinished "$head")
            on_source=$(unfinished "$source")
            waiting=$(printf '%s\n%s\n' "$on_head" "$on_source" | sed '/^$/d' | sort -u)
            if [[ -z "$waiting" ]]; then exit 0; fi
            if (( SECONDS >= deadline )); then
              echo "::warning title=Record::still running after $WAIT_MINUTES minutes, so shown as waiting: $(echo "$waiting" | paste -sd, -). Run this again when they finish"
              exit 0
            fi
            sleep 15
          done

      # GitHub does not count the checks of a `workflow_dispatch` run for a required check of a
      # ruleset, even when they pass on the PR's head, and the `pull_request` runs of a commit
      # pushed with a job's own token stay held for a person. So each job of the dispatched run
      # is reported as a commit status on the head, named as the job's check is (`private-data`, `test`), in the state the
      # job ended in, with the run's URL as its target. A status only ever reports a real run:
      # a `workflow_dispatch` run of a listed workflow, on this release branch, at this exact
      # head, that has finished. A run still going, held, cancelled or skipped, and a job that
      # was skipped, post nothing, so the check stays missing and the PR stays blocked. A job that
      # failed posts a failure. Each run is waited for, bounded by `check-wait-minutes`; run this
      # again after one that ran longer: a status already posted for the same run is not posted twice.
      - name: Report the dispatched runs as commit statuses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          fail() { echo "::error title=Record::$1"; exit 1; }
          IFS=$', \t' read -ra listed <<< "$(printf '%s' "$CHECK_WORKFLOWS" | tr '\n' ',')"
          workflows=()
          for w in "${listed[@]}"; do
            if [[ -n "$w" && " ${workflows[*]} " != *" $w "* ]]; then workflows+=("$w"); fi
          done
          if (( ${#workflows[@]} == 0 )); then
            echo 'No required-check-workflows listed: no status to post.'
            exit 0
          fi
          head=$(git -C caller rev-parse HEAD)
          short=${head:0:7}
          # Each run is waited for, bounded by the same minutes as the other checks: it may not be shown
          # yet, or still going, when the wait above ends.
          deadline=$((SECONDS + 60 * WAIT_MINUTES))
          for w in "${workflows[@]}"; do
            while :; do
              # The newest `workflow_dispatch` run of this workflow on the release branch at the head.
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?head_sha=$head&event=workflow_dispatch&per_page=100") \
                || fail "could not read the runs of the required-check workflow $w"
              run=$(jq -r --arg head "$head" --arg branch "$BRANCH" '
                  [.workflow_runs[] | select(.event == "workflow_dispatch" and .head_sha == $head and .head_branch == $branch)]
                  | sort_by(.created_at) | last // empty
                  | [.id, .status, (.conclusion // ""), .html_url] | @tsv' <<< "$runs") \
                || fail "GitHub did not answer with the runs of the required-check workflow $w"
              if [[ -n "$run" ]]; then
                IFS=$'\t' read -r id status conclusion url <<< "$run"
                if [[ "$status" == completed ]]; then break; fi
              fi
              if (( SECONDS >= deadline )); then break; fi
              sleep 15
            done
            if [[ -z "$run" ]]; then
              echo "::warning title=Record::no workflow_dispatch run of $w on $short, so no status is posted for its checks"
              continue
            fi
            [[ "$id" =~ ^[0-9]+$ ]] || fail "GitHub gave no run id for the dispatched run of $w"
            if [[ "$status" != completed ]]; then
              echo "::warning title=Record::the dispatched run $id of $w on $short is $status, so no status is posted yet. Run this again when it finishes"
              continue
            fi
            case "$conclusion" in
              success | failure | timed_out) ;;
              *)
                echo "::warning title=Record::the dispatched run $id of $w on $short ended $conclusion and made no check, so no status is posted for it"
                continue
                ;;
            esac
            jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '.jobs[] | [.name, (.conclusion // "")] | @tsv') \
              || fail "could not read the jobs of run $id of $w"
            if [[ -z "$jobs" ]]; then
              fail "run $id of $w shows no jobs, so there is no check to report"
            fi
            while IFS=$'\t' read -r name result; do
              case "$result" in
                success) state=success ;;
                failure | timed_out) state=failure ;;
                skipped | neutral) echo "The job $name of run $id was $result: no status posted."; continue ;;
                *) state=error ;;
              esac
              [[ -n "$name" ]] || fail "a job of run $id has no name"
              description="workflow_dispatch run $id on $short"
              # The newest status of this name on the head; the same state for the same run is not posted again.
              last=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/statuses?per_page=100" \
                | jq -r --arg ctx "$name" '[.[] | select(.context == $ctx)] | first // empty | [.state, .target_url] | @tsv') \
                || fail "could not read the statuses of ${short}"
              if [[ "$last" == "$(printf '%s\t%s' "$state" "$url")" ]]; then
                echo "$name is already $state on $short for run $id."
                continue
              fi
              gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head" \
                -f state="$state" -f context="$name" -f target_url="$url" -f description="$description" > /dev/null \
                || fail "could not post the status $name on $short"
              echo "Posted $name = $state on $short for run $id."
            done <<< "$jobs"
          done

      # The cut's push of the release branch made `pull_request` runs that GitHub holds for a person's
      # approval ("awaiting approval from someone with write access"). The dispatched runs above did the
      # work and their jobs are statuses now, and the cut commit changes only the changelog, so a held
      # run adds nothing but a button on the page the approver judges, and a red run in the history
      # when the PR merges. So each held run at this head, made by the push (`github-actions[bot]`),
      # is deleted when either
      #   1. its workflow is listed and has a dispatched run on this branch at this head that
      #      finished with a result (the runs the statuses above were posted for), or
      #   2. the same workflow's `pull_request` run finished with a result on the build's source
      #      commit (the commit the build was made from), on this branch. A run of this very record
      #      counts: the caller's own workflow is in progress while it clears its own held run.
      # Rule 2 reaches workflows the record did not run (a plan, the caller's own). A held run that
      # neither rule covers, or one a person made, stays: it may be the only sign that the workflow
      # exists. The step runs only for a repo that lists required-check-workflows: a repo that lists
      # none gets no statuses, so its held runs are the only way its checks run (a person approves
      # them), and deleting them would leave its required checks missing for good. Clearing is
      # tidying: a run that cannot be read or deleted is a warning, never a failed record.
      - name: Clear the held runs of the checks the record ran
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          warn() { echo "::warning title=Record::$1"; }
          IFS=$', \t' read -ra listed <<< "$(printf '%s' "$CHECK_WORKFLOWS" | tr '\n' ',')"
          workflows=()
          for w in "${listed[@]}"; do
            if [[ -n "$w" && " ${workflows[*]} " != *" $w "* ]]; then workflows+=("$w"); fi
          done
          if (( ${#workflows[@]} == 0 )); then
            echo 'No required-check-workflows listed: no held run to clear.'
            exit 0
          fi
          head=$(git -C caller rev-parse HEAD)
          short=${head:0:7}
          # The build's source. Rule 2 needs it, and needs it to be in this commit's history (only that is
          # checked here: that nothing but the notes and changelog changed since is the Same build row's
          # judgement, and a record that fails it is HOLD).
          source=$(jq -r '.build.source // empty' "$RUNNER_TEMP/results/results.json" 2> /dev/null) || source=
          if [[ ! "$source" =~ ^[0-9a-f]{40}$ ]]; then
            warn "could not read the build's source, so a held run is cleared only for a workflow the record ran"
            source=
          elif ! git -C caller merge-base --is-ancestor "$source" "$head" 2> /dev/null; then
            warn "the build's source ${source:0:7} is not in the history of $short, so a held run is cleared only for a workflow the record ran"
            source=
          fi
          # Every held run the push made at the head, as "<id><TAB><workflow file>".
          held=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request&status=action_required&per_page=100" 2> /dev/null \
            | jq -r --arg head "$head" '.workflow_runs[] | select(.head_sha == $head and .event == "pull_request" and .conclusion == "action_required" and .triggering_actor.login == "github-actions[bot]") | [(.id | tostring), ((.path // "") | sub("@.*$"; "") | split("/") | last)] | @tsv' 2> /dev/null) || held=ERROR
          if [[ "$held" == ERROR ]]; then
            warn "could not read the held runs on $short, so none is cleared"
            exit 0
          fi
          while IFS= read -r w; do
            [[ -n "$w" ]] || continue
            if [[ ! "$w" =~ ^[A-Za-z0-9._-]+\.ya?ml$ ]]; then
              warn "a held run on $short has no usable workflow file ($w): left"
              continue
            fi
            why=
            # Rule 1: the record ran this workflow itself on this branch at this head, and it finished.
            if [[ " ${workflows[*]} " == *" $w "* ]]; then
              ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?head_sha=$head&event=workflow_dispatch&per_page=100" 2> /dev/null \
                | jq -r --arg head "$head" --arg branch "$BRANCH" '[.workflow_runs[] | select(.head_sha == $head and .head_branch == $branch and .status == "completed" and (.conclusion | IN("success", "failure", "timed_out")))] | length' 2> /dev/null) || ran=
              if [[ ! "$ran" =~ ^[0-9]+$ ]]; then
                warn "could not read the dispatched runs of $w on $short, so its held runs are left"
                continue
              fi
              if (( ran > 0 )); then why="the dispatched run's checks are posted as statuses"; fi
            fi
            # Rule 2: the workflow finished on the build's source (or is this run), and the commits since add no code.
            if [[ -z "$why" && -n "$source" ]]; then
              onsrc=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$w/runs?head_sha=$source&event=pull_request&per_page=100" 2> /dev/null \
                | jq -r --arg src "$source" --arg branch "$BRANCH" --arg this "${GITHUB_RUN_ID:-}" '[.workflow_runs[] | select(.head_sha == $src and .head_branch == $branch and .event == "pull_request" and ((.status == "completed" and (.conclusion | IN("success", "failure", "timed_out"))) or ((.id | tostring) == $this)))] | length' 2> /dev/null) || onsrc=
              if [[ ! "$onsrc" =~ ^[0-9]+$ ]]; then
                warn "could not read the runs of $w on the build's source ${source:0:7}, so its held runs are left"
                continue
              fi
              if (( onsrc > 0 )); then why="$w finished on the build's source ${source:0:7}, and the record holds the build since then to the notes and changelog"; fi
            fi
            if [[ -z "$why" ]]; then
              echo "$w has no finished run on $short from the record, nor on the build's source: its held runs are left."
              continue
            fi
            while IFS=$'\t' read -r id file; do
              [[ "$file" == "$w" ]] || continue
              if [[ ! "$id" =~ ^[0-9]+$ ]]; then
                warn "a held run of $w on $short has no usable id: left"
                continue
              fi
              if err=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" 2>&1 > /dev/null); then
                echo "Deleted the held run $id of $w on $short: $why."
              else
                warn "could not delete the held run $id of $w on $short: ${err:0:200}"
              fi
            done <<< "$held"
          done < <(cut -f2 <<< "$held" | sort -u)

      - name: Write the record into the PR body
        shell: bash
        env:
          SHIPYARD_SHA: ${{ steps.self.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          args=()
          if [[ -n "$SHIPYARD_SHA" ]]; then args+=(--shipyard-sha "$SHIPYARD_SHA"); fi
          if [[ -n "$IGNORE_CHECKS" ]]; then args+=(--ignore-checks "$IGNORE_CHECKS"); fi
          if [[ -n "$FLEET_LOGINS" ]]; then args+=(--fleet-logins "$FLEET_LOGINS"); fi
          if [[ -n "$ASK_WORKFLOW" ]]; then args+=(--ask-workflow "$ASK_WORKFLOW"); fi
          node shipyard/bin/shipyard record --from-candidate --draft-until-ship --release-run "$RESULTS_RUN" --update --results "$RUNNER_TEMP/results/results.json" --pr "$PR" \
            --dir caller --out "$RUNNER_TEMP/record.md" --changelog "$CHANGELOG" --armed-label "$ARMED_LABEL" "${args[@]}" \
            | tee "$RUNNER_TEMP/record.log"

      # A CLI's release PR is opened with the job's token, so no `workflow_run` follows this run and the caller's ask never starts
      # (GitHub creates no run for an event that token causes, bar `workflow_dispatch`). With `ask-workflow` set, a record that
      # has just written SHIP starts the ask itself: `workflow_dispatch` on the default branch with the PR's number, which the
      # job's token does start. The ask workflow keeps every check it makes (a draft, a missing or stale record, the default branch).
      # Only for a record that says SHIP, only while the PR is still at the head this run recorded, ready for review, and
      # once for each head: a commit status `shipyard/ask` on the head says it was started, so a record run that comes again on
      # the same head starts nothing. The ask is a courtesy and never holds a release: one that cannot be started is a warning.
      # A record that says HOLD, or a head that moved, starts none.
      - name: Ask the approvers once the record says SHIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          warn() { echo "::warning title=Record::$1"; }
          if [[ -z "$ASK_WORKFLOW" ]]; then
            echo 'No ask-workflow listed: no ask is started.'
            exit 0
          fi
          # The line `shipyard record` prints: "Record for <tag>: SHIP" or "Record for <tag>: HOLD (<reasons>)".
          if ! grep -Eq '^Record for [A-Za-z0-9._-]+: SHIP([ .]|$)' "$RUNNER_TEMP/record.log"; then
            echo 'The record does not say SHIP: no ask is started.'
            exit 0
          fi
          head=$(git -C caller rev-parse HEAD)
          short=${head:0:7}
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.sha, (.draft | tostring)] | @tsv') \
            || { warn "could not read #$PR, so the ask is not started"; exit 0; }
          IFS=$'\t' read -r now draft <<< "$pull"
          if [[ "$now" != "$head" ]]; then
            echo "#$PR moved to ${now:0:7} since the record at $short: the record of that commit starts the ask."
            exit 0
          fi
          if [[ "$draft" != false ]]; then
            warn "#$PR is still a draft at $short although the record says SHIP, and the ask refuses a draft, so it is not started"
            exit 0
          fi
          started=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/statuses?per_page=100" --jq '[.[] | select(.context == "shipyard/ask")] | length') \
            || { warn "could not read the statuses of $short, so the ask is not started"; exit 0; }
          if [[ "$started" != 0 ]]; then
            echo "The ask was already started for $short: not started again."
            exit 0
          fi
          default=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch) \
            || { warn "could not read the default branch, so the ask is not started"; exit 0; }
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$ASK_WORKFLOW/dispatches" -f ref="$default" -f "inputs[pr]=$PR" > /dev/null; then
            warn "the ask workflow $ASK_WORKFLOW could not be started on $default: it must exist there and accept workflow_dispatch with an input pr. Run it by hand for #$PR"
            exit 0
          fi
          echo "Started $ASK_WORKFLOW on $default for #$PR (the record at $short says SHIP)."
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head" \
            -f state=success -f context=shipyard/ask -f description="Ask started for #$PR on $default" > /dev/null \
            || warn "could not post the status shipyard/ask on $short: a record run that comes again on it starts the ask again"

  # A review: the same record, read again from the results of the release run the record on the
  # page names, once that run is checked to be this release's; a page that names none is read from
  # the evidence its head holds (a release PR recorded before the record stopped committing).
  # Nothing is committed or pushed and no check is run again. The job is named `record` as the first
  # is, so the caller's `ignore-checks` names its check too. Its group is its own, so a review never
  # replaces a record waiting in the first job's group (a push's run must not be lost). A review
  # that reads a head a push then moves finds the PR moved when it writes, and is refused
  # (`shipyard record` refuses a PR that moved while it read).
  record-review:
    name: record
    if: ${{ inputs.review }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: shipyard-record-review-${{ github.repository }}-${{ inputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: write        # kept equal to the record job's (a caller grants one set to both); this job commits nothing, pushes nothing and leaves the PR's draft state as it is
      pull-requests: write   # write the record into the PR body
      issues: read           # who wrote and armed each change's issue
      checks: read           # the candidate's check runs
      actions: read          # the release run and its `results` artifact; the event of each check run's workflow run (a Dependabot or scheduled run is not judged)
      statuses: write        # read its commit statuses, and set `shipyard/release` on the head (the one write this job makes besides the body)
      id-token: write        # learn which commit of this workflow is running (job_workflow_sha)
    env:
      PR: ${{ inputs.pr }}
      IGNORE_CHECKS: ${{ inputs.ignore-checks }}
      FLEET_LOGINS: ${{ inputs.fleet-logins }}
      ARMED_LABEL: ${{ inputs.armed-label }}
      CHANGELOG: ${{ inputs.changelog }}
      ASK_WORKFLOW: ${{ inputs.ask-workflow }}
    steps:
      - name: Check the review's inputs
        shell: bash
        run: |
          fail() { echo "::error title=Record::$1"; exit 2; }
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || fail 'pr must be the release PR'"'"'s number'
          [[ "$CHANGELOG" =~ ^[A-Za-z0-9._/-]+$ && "$CHANGELOG" != -* && "$CHANGELOG" != *..* && "$CHANGELOG" != /* ]] || fail 'changelog must be a path inside the repo'
          [[ -z "$ASK_WORKFLOW" || "$ASK_WORKFLOW" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*\.ya?ml$ ]] || fail 'ask-workflow must be the file name of a workflow in .github/workflows (ask.yml)'

      - name: Find this workflow's commit for the review
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/record.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows record.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Record::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit for the review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      - name: Find the release PR's branch for the review
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.ref, .head.repo.full_name, .state] | @tsv')
          IFS=$'\t' read -r branch head_repo state <<< "$pull"
          if [[ ! "$branch" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Record::#$PR does not come from a release/X.Y.Z branch, so it is not a release PR"
            exit 1
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if [[ "$(lower "$head_repo")" != "$(lower "$GITHUB_REPOSITORY")" ]]; then
            echo "::error title=Record::#$PR comes from another repo ($head_repo), not a candidate of this one"
            exit 1
          fi
          if [[ "$state" != "open" ]]; then
            echo "::error title=Record::#$PR is $state: a record is written for an open candidate"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The candidate as the PR has it now, with its history and tags. No credentials stay in the checkout.
      - name: Check out the candidate for the review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          path: caller
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The release run the record on the page names (`<!-- shipyard:release-run <id> -->`), or none.
      # Whether it is this release's is checked when the record reads it, below.
      - name: Find the release run the record names
        id: run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node shipyard/bin/shipyard record --find-release-run --pr "$PR" --out "$RUNNER_TEMP/release-run"
          run=$(cat "$RUNNER_TEMP/release-run")
          [[ -z "$run" || "$run" =~ ^[1-9][0-9]*$ ]] || { echo "::error title=Record::the release run the record names is not a run id"; exit 2; }
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # An artifact that has expired, or that the run never made, downloads nothing: the record then
      # writes HOLD and says why, so a failed download is a warning here.
      - name: Get the release run's results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.run.outputs.run }}
        run: |
          if [[ -z "$RUN" ]]; then
            echo 'The record names no release run: the review reads the evidence the head holds, if any.'
            exit 0
          fi
          if ! gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name results --dir "$RUNNER_TEMP/results"; then
            echo "::warning title=Record::the artifact 'results' of run $RUN could not be downloaded: the record says why"
          fi

      - name: Write the record into the PR body for the review
        shell: bash
        env:
          SHIPYARD_SHA: ${{ steps.self.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN: ${{ steps.run.outputs.run }}
        run: |
          args=()
          if [[ -n "$SHIPYARD_SHA" ]]; then args+=(--shipyard-sha "$SHIPYARD_SHA"); fi
          if [[ -n "$IGNORE_CHECKS" ]]; then args+=(--ignore-checks "$IGNORE_CHECKS"); fi
          if [[ -n "$FLEET_LOGINS" ]]; then args+=(--fleet-logins "$FLEET_LOGINS"); fi
          if [[ -n "$ASK_WORKFLOW" ]]; then args+=(--ask-workflow "$ASK_WORKFLOW"); fi
          if [[ -n "$RUN" ]]; then
            # The same record the build job writes, from the same results; it leaves the draft state alone.
            node shipyard/bin/shipyard record --from-candidate --review --release-run "$RUN" --update --results "$RUNNER_TEMP/results/results.json" --pr "$PR" \
              --dir caller --out "$RUNNER_TEMP/record.md" --changelog "$CHANGELOG" --armed-label "$ARMED_LABEL" "${args[@]}"
          else
            node shipyard/bin/shipyard record --from-evidence --update --pr "$PR" \
              --dir caller --out "$RUNNER_TEMP/record.md" --changelog "$CHANGELOG" --armed-label "$ARMED_LABEL" "${args[@]}"
          fi
