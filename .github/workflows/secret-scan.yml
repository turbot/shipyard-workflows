# Fails a PR that adds a secret. It runs gitleaks over the commits the PR adds (base to head), with the
# values redacted, and the log names the file, the line and the rule, never the secret.
#
# Source of truth is this file in turbot/shipyard (workflows/). It is published to
# .github/workflows/ in turbot/shipyard-workflows. It runs only where a repo calls it at `v0` from its own
# workflow, or where an org ruleset's `workflows` rule requires it (the rule runs this file on the PR's own
# `pull_request` event). No org ruleset requires it yet. A caller grants `contents: read` (check out the
# PR's commits) and `id-token: write` (learn which commit of this workflow is running). docs/secret-scan.md
# says what it checks, how a repo records an exception and what to do about a real secret.
#
# Safe on `pull_request`: the PR's code is checked out and only read. gitleaks scans it as text; nothing from the
# PR is run. A repo's exceptions are its own `.gitleaks.toml` and `.gitleaksignore` at the PR's head, so this
# file names no repo and no path. gitleaks is a pinned release, whose checksum is checked before it runs: not
# `gitleaks-action`, which needs a paid licence for an organization.

name: Secret scan

on:
  workflow_call:
  pull_request:
  merge_group:

permissions: {}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # check out the repo's commits
      id-token: write  # learn which commit of this workflow is running (job_workflow_sha)
    steps:
      # The whole history, so the PR's base and head commits and the range between them are there to scan.
      - name: Check out the PR's commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: caller
          fetch-depth: 0
          persist-credentials: false

      # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
      # workflow, which is the commit of shipyard to run.
      #
      # GitHub gives a PR from a fork, and a PR Dependabot opened, no OIDC token whatever the job asks for. Such a
      # PR runs shipyard at SHIPYARD_TAG, the release tag the org rule names, so its scan still runs; the log says
      # so. Any other run with no token is a job that was not granted id-token: write, and fails. A token that is
      # given but cannot be read fails too: the tag is only for a run GitHub gives none.
      - name: Find this workflow's commit
        id: self
        shell: bash
        env:
          SHIPYARD_TAG: v0
        run: |
          node - <<'JS'
          (async () => {
            const fs = require('node:fs');
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) {
              const pr = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).pull_request;
              const bot = 'dependabot[bot]';
              const fork = Boolean(pr) && (!pr.head || !pr.head.repo || !pr.base || !pr.base.repo || pr.head.repo.full_name !== pr.base.repo.full_name);
              const dependabot = Boolean(pr) && (process.env.GITHUB_ACTOR === bot || (pr.user && pr.user.login === bot));
              if (!fork && !dependabot) throw new Error('no OIDC token: the job must be granted id-token: write');
              const tag = process.env.SHIPYARD_TAG;
              if (!/^v\d+$/.test(tag)) throw new Error('SHIPYARD_TAG is not a release tag');
              const who = fork ? 'a PR from a fork' : 'a PR Dependabot opened';
              console.log(`GitHub gives ${who} no OIDC token, so this scan runs shipyard at ${tag}, the release tag the org rule names.`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `ref=${tag}\nwhy=${who}\n`);
              return;
            }
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/secret-scan.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows secret-scan.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ref=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Secret scan::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.ref }}
          path: shipyard
          persist-credentials: false

      # Names the commit of shipyard the scan runs. On a PR GitHub gives no OIDC token (`why` is set), that is the
      # commit the tag pointed to when it was checked out, and a notice says the scan ran at the tag and why.
      - name: Say which shipyard runs
        shell: bash
        env:
          REF: ${{ steps.self.outputs.ref }}
          WHY: ${{ steps.self.outputs.why }}
        run: |
          commit="$(git -C shipyard rev-parse HEAD)"
          if [ -n "$WHY" ]; then
            echo "::notice title=Secret scan::This scan ran shipyard at ${REF}, which pointed to commit ${commit}, because ${WHY} has no sign-in (OIDC) token: the one case it does not run its own commit."
          else
            echo "This scan runs shipyard at commit ${commit}, the commit of this workflow."
          fi

      # The release and its checksum are pinned here, so a change of either is a reviewed change to this file.
      # The checksum is the one the gitleaks release publishes for this archive (gitleaks_<version>_checksums.txt).
      # `sha256sum --check` fails the step when the download differs, and nothing is unpacked before it passes.
      - name: Download gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dest="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dest"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$dest/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $dest/$archive" | sha256sum --check --strict -
          tar -xzf "$dest/$archive" -C "$dest" gitleaks
          "$dest/gitleaks" version

      # Only the commits the PR adds, base to head. A merge queue's group is scanned the same way.
      - name: Scan the PR's new commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node shipyard/bin/shipyard secret-scan --dir caller --base "$BASE_SHA" --head "$HEAD_SHA" --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
