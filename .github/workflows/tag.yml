# Tags a release once it has shipped: an annotated tag at the release PR's merge commit, made as
# the area's release App, and the floating major tag (`v1`) moved when the repo has one. Then the
# GitHub Release at the tag (its body the CHANGELOG section) and one "Shipped" comment on the
# release PR, each made once.
# docs/release-tag.md says which signals a repo wires up.
#
# Source of truth is this file in turbot/shipyard (workflows/). It is published to
# .github/workflows/ in turbot/shipyard-workflows, and every repo calls that copy pinned by
# commit. A caller runs it from one of these triggers:
#
#   a push to main or main-*   after the repo's ship job (`needs: ship`, `ship-result: ${{ needs.ship.result }}`),
#                              or on its own for a Go library (`signal: merge`: the tag is the publish)
#   an issue_comment           `/shipped` on a merged release PR, from a person with write access. It
#                              runs on the default branch, which the release environment refuses, so the
#                              `shipped` job checks the comment with no secret and starts the caller's
#                              own workflow on the PR's base branch (workflow_dispatch, inputs pr and comment)
#   that workflow_dispatch     the `tag` job reads the comment again and tags
#
# The release App's token is made here, in the `tag` job, which runs in the caller's `release`
# environment (docs/release-apps.md): `vars.RELEASE_APP_CLIENT_ID` and `secrets.RELEASE_APP_PRIVATE_KEY`,
# for this repo only, with contents write and pull-requests write (and, with `merge-back` on, checks read and commit statuses read). The caller passes no token: a job
# that calls a reusable workflow runs no steps, and GitHub drops a job output that holds a secret. It
# passes the key by name only, as GitHub asks of an environment secret a called workflow reads; the
# value is the environment's. The job never falls back to its own token: with either name missing it
# fails before anything is read.
#
# Nothing here checks out the caller's repo or runs its code: GitHub is asked for the PR, the tags,
# the commit, and its CHANGELOG and release notes files, and the PR's text is data. The job's own
# token only reads (and, in the `shipped` job, starts the caller's workflow); the release App's token
# is in the environment of the last two steps alone: the first makes the tag, the Release and the comment,
# the second (once the tag is made) merges the release back into the work branch the candidate came from.

name: Tag

on:
  workflow_call:
    inputs:
      signal:
        description: 'ship-job: the repo''s ship job ran first (pass its result as ship-result). merge: a Go library, where the tag is the publish.'
        type: string
        default: ship-job
      ship-result:
        description: With the ship-job signal on a push, the ship job's own result (needs.<job>.result). Anything but success tags nothing.
        type: string
        default: ''
      tag-prefix:
        description: The prefix of the repo's release tags.
        type: string
        default: v
      automation-logins:
        description: 'The accounts that open release PRs, comma-separated. Required: a merged release/ PR from any other account is never tagged.'
        type: string
        required: true
      floating-major:
        description: Move the repo's floating major tag (v0, v1) to each release that is the newest of its major.
        type: boolean
        default: false
      merge-back:
        description: After the tag, open a PR from the release branch into the work branch the candidate was cut from, and merge it with a merge commit once its checks pass. The release App then needs pull requests and contents write, and checks and commit statuses read.
        type: boolean
        default: true
      product:
        description: 'The product''s name, for a GitHub Release title when the release has no release notes ("<product> <version>"). Default: the repo''s name.'
        type: string
        default: ''
      changelog:
        description: The product's changelog, relative to the repo. Its section for the version is the GitHub Release's body.
        type: string
        default: CHANGELOG.md
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: The release App's key, passed by name as the secret of the same name (docs/release-tag.md). Its value comes from the caller's release environment, and only the tag job, in that environment, reads it. A secret the caller does not pass is empty here.
        required: false

permissions: {}

jobs:
  # A `/shipped` comment: the release environment refuses the default branch the comment runs on, so
  # this job holds no secret. It checks the comment and the release PR, and starts the caller's own
  # workflow on the PR's base branch, where the `tag` job runs.
  shipped:
    name: shipped
    if: ${{ github.event_name == 'issue_comment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read        # the tags
      pull-requests: read   # the release PR
      actions: write        # start the caller's workflow on the release PR's base branch
      id-token: write       # learn which commit of this workflow is running (job_workflow_sha)
    steps:
      - name: Find this workflow's commit
        # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
        # workflow, which is the commit of shipyard to run.
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/tag.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows tag.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Tag::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      # Inputs reach the command as environment, never as shell text. GITHUB_WORKFLOW_REF names the
      # caller's workflow, the one the command starts.
      - name: Check /shipped and start the tag run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          AUTOMATION_LOGINS: ${{ inputs.automation-logins }}
        run: |
          if [ -z "${AUTOMATION_LOGINS//[[:space:],]/}" ]; then echo "::error::automation-logins names no account: name the accounts that open release PRs"; exit 1; fi
          node shipyard/bin/shipyard tag --tag-prefix "$TAG_PREFIX" --automation-logins "$AUTOMATION_LOGINS"

  # A push to main or main-*, or the run a `/shipped` started there: the job that holds the release key.
  tag:
    name: tag
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35   # the merge-back waits up to 20 minutes for the PR's checks
    environment: release    # the caller's: RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY (docs/release-apps.md)
    permissions:
      contents: read        # the tags, the merge commit, and its changelog and release notes
      pull-requests: read   # the release PR, and the commits a PR was merged as
      id-token: write       # learn which commit of this workflow is running (job_workflow_sha)
    steps:
      # Before anything is read: the release environment's names are there, and the run is on main or
      # main-<x.y>, the only branches the environment may let reach the key. Never the job's own token
      # in place of the App's. Only whether the key is set reaches this step, never the key.
      - name: Check the release environment
        shell: bash
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          missing=()
          [ -n "$CLIENT_ID" ] || missing+=("the variable RELEASE_APP_CLIENT_ID is not set in the release environment")
          [ "$HAS_KEY" = "true" ] || missing+=("the secret RELEASE_APP_PRIVATE_KEY is not set in the release environment, or the caller does not pass it by name")
          for m in "${missing[@]}"; do echo "::error title=Tag::${m}: set it up as docs/release-apps.md and docs/release-tag.md in turbot/shipyard say. Nothing was tagged"; done
          [ "${#missing[@]}" -eq 0 ] || exit 1
          if ! [[ "$GITHUB_REF" =~ ^refs/heads/main(-(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?)?$ ]]; then
            echo "::error title=Tag::the release key is read only on main or main-<x.y>, and this run is on another ref. Nothing was tagged"
            exit 1
          fi

      - name: Find this workflow's commit
        # `job_workflow_sha` is a claim of the job's OIDC token: the commit of this reusable
        # workflow, which is the commit of shipyard to run.
        id: self
        shell: bash
        run: |
          node - <<'JS'
          (async () => {
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            if (!url) throw new Error('no OIDC token: the caller must grant id-token: write');
            const res = await fetch(`${url}&audience=shipyard`, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
              signal: AbortSignal.timeout(20000),
            });
            if (!res.ok) throw new Error(`OIDC token request answered ${res.status}`);
            const { value } = await res.json();
            const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString());
            const ref = String(claims.job_workflow_ref);
            if (!ref.startsWith('turbot/shipyard-workflows/.github/workflows/tag.yml@')) {
              throw new Error('this workflow must run as turbot/shipyard-workflows tag.yml');
            }
            if (!/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) throw new Error('job_workflow_sha is not a commit');
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `sha=${claims.job_workflow_sha}\n`);
          })().catch((e) => {
            console.log(`::error title=Tag::${e.message}`);
            process.exit(2);
          });
          JS

      - name: Check out shipyard at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/shipyard-workflows
          ref: ${{ steps.self.outputs.sha }}
          path: shipyard
          persist-credentials: false

      # For this repo only, with only what the tag and merge-back steps use. The action revokes it when the job ends.
      - name: Make the release App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # The merge-back waits for the PR's checks, and the job's own token reads neither. Left empty (not asked for)
          # when the caller turns the merge-back off, so an App without them still makes its token.
          permission-checks: ${{ inputs.merge-back && 'read' || '' }}
          permission-statuses: ${{ inputs.merge-back && 'read' || '' }}

      # Inputs reach the command as environment, never as shell text.
      - name: Tag the release
        id: tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ steps.app.outputs.token }}
          SIGNAL: ${{ inputs.signal }}
          SHIP_RESULT: ${{ inputs.ship-result }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          AUTOMATION_LOGINS: ${{ inputs.automation-logins }}
          FLOATING_MAJOR: ${{ inputs.floating-major }}
          PRODUCT: ${{ inputs.product }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          # Never empty: with no one named, a release/ PR from any account that merged could be tagged.
          if [ -z "${AUTOMATION_LOGINS//[[:space:],]/}" ]; then echo "::error::automation-logins names no account: name the accounts that open release PRs"; exit 1; fi
          args=(--signal "$SIGNAL" --tag-prefix "$TAG_PREFIX" --automation-logins "$AUTOMATION_LOGINS")
          [ -n "$CHANGELOG" ] && args+=("--changelog=$CHANGELOG")
          [ -n "$PRODUCT" ] && args+=("--product=$PRODUCT")
          [ -n "$SHIP_RESULT" ] && args+=(--ship-result "$SHIP_RESULT")
          [ "$FLOATING_MAJOR" = "true" ] && args+=(--floating-major)
          node shipyard/bin/shipyard tag "${args[@]}"

      # Only for a release that is tagged (the step above says which). It fails, leaving the PR open,
      # when the merge cannot be done: the tag stays, and the message says what to do.
      - name: Merge the release back
        if: ${{ inputs.merge-back && steps.tag.outputs.tag != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ steps.app.outputs.token }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          AUTOMATION_LOGINS: ${{ inputs.automation-logins }}
        run: node shipyard/bin/shipyard merge-back --tag-prefix "$TAG_PREFIX" --automation-logins "$AUTOMATION_LOGINS"
